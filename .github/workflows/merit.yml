name: merit-ledger
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/merit.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "cyberpusa-ai"
          git config user.email "354205713+cyberpusa-ai@users.noreply.github.com"
          git add assets/merit.svg
          git diff --cached --quiet || git commit -m "功德 ledger: daily update"
          git push
